<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vignanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1B365D" />
    </linearGradient>
    <linearGradient id="vignanRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C81E1E" />
      <stop offset="100%" stop-color="#E53935" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F2C59" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark Left -->
  <g transform="translate(10, 8)">
    <!-- Outer Gear/Sunburst Pattern -->
    <circle cx="42" cy="42" r="38" fill="none" stroke="#C81E1E" stroke-width="2.5" stroke-dasharray="4,2.5" />
    <circle cx="42" cy="42" r="32" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2" />
    
    <!-- Central Torch / Star Flame -->
    <circle cx="42" cy="42" r="22" fill="#F8FAFC" />
    <path d="M42 24 C45 32, 52 35, 52 44 C52 50, 47 55, 42 55 C37 55, 32 50, 32 44 C32 35, 39 32, 42 24 Z" fill="url(#vignanRedGrad)" />
    <circle cx="42" cy="44" r="5" fill="#FBBF24" />
    <path d="M42 16 L42 22 M26 42 L20 42 M58 42 L64 42 M31 31 L26 26 M53 31 L58 26" stroke="#0F2C59" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text Group -->
  <g transform="translate(100, 10)">
    <!-- Main VIGNAN'S Title -->
    <text x="0" y="32" font-family="'Outfit', 'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#C81E1E" letter-spacing="1">VIGNAN'S</text>
    
    <!-- Subtitle -->
    <text x="2" y="46" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#0F2C59" letter-spacing="0.6">FOUNDATION FOR SCIENCE, TECHNOLOGY &amp; RESEARCH</text>
    
    <!-- Blue Estd Banner -->
    <rect x="0" y="52" width="270" height="18" rx="3" fill="url(#vignanBlueGrad)" />
    <text x="8" y="64.5" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#FFFFFF" letter-spacing="0.3">(Deemed to be University)  Estd. u/s 3 of UGC Act 1956</text>
  </g>

  <!-- Accreditation Badges Right -->
  <g transform="translate(385, 12)">
    <!-- Divider -->
    <line x1="-12" y1="4" x2="-12" y2="68" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- NAAC Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="54" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#softShadow)" />
      <text x="27" y="13" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#64748B" text-anchor="middle">NAAC</text>
      <text x="27" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#C81E1E" text-anchor="middle">'A+'</text>
    </g>

    <!-- NIRF Badge -->
    <g transform="translate(62, 0)">
      <rect x="0" y="0" width="56" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#softShadow)" />
      <text x="28" y="13" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#64748B" text-anchor="middle">NIRF</text>
      <text x="28" y="26" font-family="'Outfit', sans-serif" font-size="11" font-weight="900" fill="#0F2C59" text-anchor="middle">70th</text>
    </g>

    <!-- ISO / Accredited Tag -->
    <g transform="translate(0, 38)">
      <rect x="0" y="0" width="118" height="20" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="12" cy="10" r="4" fill="#10B981" />
      <text x="22" y="13.5" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#334155" letter-spacing="0.4">ACCREDITED UNIVERSITY</text>
    </g>
  </g>
</svg>
