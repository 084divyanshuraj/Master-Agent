services:
  - type: web
    name: vignan-master-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: GROQ_MODEL_SYNTHESIS
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEYS
        sync: false
      - key: MONGODB_URI
        sync: false
